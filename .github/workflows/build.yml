name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1
      - name: Prepare game
        run: |
          mkdir www
          cp "$(ls *.html | head -n1)" www/index.html
          curl -fsSL https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js -o www/three.min.js || true
      - name: Create Android project
        run: |
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Wild Frontier" com.wildfrontier.game --web-dir=www
          npx cap add android
          sed -i 's/<activity/<activity android:screenOrientation="sensorLandscape"/' android/app/src/main/AndroidManifest.xml
          npx cap sync android
      - name: Fullscreen without side bar
        run: |
          python3 - <<'PY'
          import re
          p='android/app/src/main/res/values/styles.xml'
          s=open(p).read()
          add='\n        <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>\n        <item name="android:windowBackground">@android:color/black</item>\n        <item name="android:windowFullscreen">true</item>'
          s=re.sub(r'(<style\b[^>]*>)',lambda m:m.group(1)+add,s)
          open(p,'w').write(s)
          PY
          cat > android/app/src/main/java/com/wildfrontier/game/MainActivity.java <<'JAVA'
          package com.wildfrontier.game;

          import android.os.Build;
          import android.os.Bundle;
          import android.view.WindowManager;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              goFullscreen();
            }

            @Override
            public void onWindowFocusChanged(boolean hasFocus) {
              super.onWindowFocusChanged(hasFocus);
              if (hasFocus) goFullscreen();
            }

            private void goFullscreen() {
              WindowCompat.setDecorFitsSystemWindows(getWindow(), false);
              if (Build.VERSION.SDK_INT >= 28) {
                WindowManager.LayoutParams lp = getWindow().getAttributes();
                lp.layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
                getWindow().setAttributes(lp);
              }
              WindowInsetsControllerCompat c = WindowCompat.getInsetsController(getWindow(), getWindow().getDecorView());
              c.setSystemBarsBehavior(WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
              c.hide(WindowInsetsCompat.Type.systemBars());
            }
          }
          JAVA
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: wild-frontier-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
